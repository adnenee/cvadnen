        * {

            display: grid;
            grid-template-columns: 420px 1fr;
            min-height: 100vh;
            position: relative;
        }

        /* Force single column layout for problematic range */
        @media (max-width: 652px) {

                grid-template-columns: none !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;

            padding: 50px 40px;

            overflow: visible;
        }

        .profile-section::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -40px;
            right: -40px;
            width: calc(100% + 80px);
            height: 120px;
            background: white;
            z-index: 1;

        .main-content {

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            opacity: 0.03;
            animation: float 20s infinite linear;
        }

        .shape-1 {
            top: 10%;
            left: 10%;
            width: 100px;
            height: 100px;
            background: var(--primary-color);
            border-radius: 50%;
            animation-delay: 0s;
        }

        .shape-2 {
            top: 60%;
            right: 15%;
            width: 80px;
            height: 80px;
            background: var(--accent-color);
            transform: rotate(45deg);
            animation-delay: 5s;
        }

        .shape-3 {
            bottom: 20%;
            left: 20%;
            width: 60px;
            height: 60px;
            background: var(--secondary-color);
            border-radius: 30%;
            animation-delay: 10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            25% {
                transform: translateY(-20px) rotate(90deg);
            }

            50% {
                transform: translateY(-10px) rotate(180deg);
            }

            75% {
                transform: translateY(-30px) rotate(270deg);
            }
        }

        .profile-section {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

            width: 200px;
            height: 240px;
            margin: 0px auto 25px;
            background: transparent;
            padding: 0;
            overflow: visible;
            position: relative;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none;
            z-index: 10;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        @keyframes gentle-float {

            50% {
                transform: translateY(-3px) scale(1.02);
            }
        }

        .profile-img.floating::before {
            display: none;

            }

            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }
